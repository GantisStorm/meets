<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build Meets from source</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      color-scheme: dark;
      --bg: #111214;
      --panel: #191b1f;
      --text: rgba(255,255,255,0.88);
      --muted: rgba(255,255,255,0.56);
      --accent: #34d399;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 10%, rgba(52,211,153,0.10), transparent 34%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    }

    main {
      width: min(440px, calc(100vw - 32px));
      padding: 28px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      background: color-mix(in srgb, var(--panel) 86%, transparent);
      box-shadow: 0 24px 90px rgba(0,0,0,0.32);
      text-align: center;
    }

    img {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: -0.03em;
    }

    p {
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <img src="../icon.png" alt="Meets">
    <h1>Meets is available as source</h1>
    <p>No binary release has been published for this fork yet.</p>
    <p><a href="https://github.com/GantisStorm/meets#build-it">Build Meets on your Mac</a> or check <a href="https://github.com/GantisStorm/meets/releases">Releases</a> for future downloads.</p>
  </main>


</body>
</html>
